name: Sync CI

on:
  pull_request:
  push:
    branches:
      - main

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  sync-tests:
    name: Build, static checks, and sync E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: JavaScript syntax checks
        run: |
          node --check frontend/js/sync.js
          node --check frontend/js/firebase-client.js
          node --check frontend/js/navigation.js
          node --check frontend/js/storage.js
          node --check frontend/js/app.js
          node --check frontend/js/data.js
          node --check scripts/e2e-server.mjs
          node --check scripts/test-sync.mjs

      - name: Sync E2E
        run: npm run test:sync
