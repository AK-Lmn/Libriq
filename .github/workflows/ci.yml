name: Libriq CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  test:
    name: Lint, Build, and Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: JavaScript Syntax & Static Analysis
        run: |
          node --check server/app.js
          node --check server/auth.js
          node --check server/catalog.js
          node --check server/config.js
          node --check server/response.js
          node --check server/middleware/auth.js
          node --check server/middleware/validate.js
          node --check server/middleware/errorHandler.js
          node --check scripts/generate-config.mjs
          node --check scripts/e2e-server.mjs
          node --check frontend/js/sync.js
          node --check frontend/js/firebase-client.js
          node --check frontend/js/navigation.js
          node --check frontend/js/storage.js
          node --check frontend/js/app.js
          node --check frontend/js/data.js

      - name: Build
        run: npm run build

      - name: Run Core Test Suite
        run: npm test

      - name: Run Critical Module Regression Checks
        run: |
          npm run test:data-modules
          npm run test:storage-modules
          npm run test:utils-modules
          npm run test:api-modules
          npm run test:identity
